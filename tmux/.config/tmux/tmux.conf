##### Core sanity #####

# Use Ctrl-a like screen, because Ctrl-b is a crime
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Faster escape for Vim
set -sg escape-time 0

# True color + sane terminal
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
set-option -g focus-events on

# Let OSC 8 hyperlinks (and sixel/iTerm2 image protocols) pass through to the outer terminal
set -g allow-passthrough on
set -as terminal-features ",*:hyperlinks"

# Undercurl support (needed for Neovim diagnostics)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Start window and pane numbers at 1 (like Vim)
set -g base-index 1
setw -g pane-base-index 1

# Bigger scrollback buffer
set -g history-limit 50000

# Messages stay visible longer
set -g display-time 3000
set -g display-panes-time 3000

##### Vim-friendly navigation #####

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Splits that make sense #####

# | for vertical, - for horizontal (open in current directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window also opens in current directory
bind c new-window -c "#{pane_current_path}"

##### Copy mode (vi-style) #####

setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

##### Mouse (controversial but useful in WSL) #####

set -g mouse on

##### Window management #####

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Auto-rename windows to running process
setw -g automatic-rename on

# Swap windows left/right with Shift+Left/Right
bind -r S-Left swap-window -t -1\; select-window -t -1
bind -r S-Right swap-window -t +1\; select-window -t +1

##### Activity monitoring #####

# Highlight windows with new output
setw -g monitor-activity on
set -g visual-activity off

##### Synchronize panes #####

# Toggle typing in all panes simultaneously
bind S setw synchronize-panes\; display-message "synchronize-panes #{?pane_synchronized,on,off}"

##### Floating popups (tmux 3.2+) #####

# Scratch terminal
bind ` display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

# Lazygit in a popup
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"

# htop in a popup
bind T display-popup -E -w 80% -h 80% "htop"

##### Status bar (quiet, not needy) #####

set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=default,fg=colour244"

set -g status-left "#[fg=colour39] #S "
set -g status-right "#[fg=colour244]%Y-%m-%d %H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour39] #I:#W "

##### Session management #####

# Create a new session (prompts for name)
bind N command-prompt -p "new session:" "new-session -s '%%'"

# Session picker (tree view)
bind s choose-tree -sZ

# Kill session without leaving tmux
bind X confirm-before -p "kill-session #S? (y/n)" kill-session

# Switch to last session
bind \\ switch-client -l

##### Quick window access #####

# Alt+number to jump to window (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Quick switch to last window
bind Tab last-window

##### Pane layout & operations #####

# Cycle through layouts
bind -r n next-layout

# Break pane into its own window
bind B break-pane

# Join a pane from another window (prompts for source)
bind V command-prompt -p "join pane from:" "join-pane -s '%%'"

# Rotate panes in current window
bind -r o rotate-window

# Swap current pane with the next/previous
bind -r > swap-pane -D
bind -r < swap-pane -U

# Even out pane sizes (horizontal / vertical)
bind = select-layout even-horizontal
bind + select-layout even-vertical

##### Quality of life #####

# Reload config easily
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux reloaded"

# Dead panes stay off by default (toggle with prefix+D if needed)
set -g remain-on-exit off
bind D set remain-on-exit\; display-message "remain-on-exit #{?remain-on-exit,on,off}"

##### TPM plugins #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-urlview'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'janoamaral/tokyo-night-tmux'

set -g @tokyo-night-tmux_theme 'night'
set -g @tokyo-night-tmux_pane_id_style 'hsquare'
set -g @tokyo-night-tmux_zoom_id_style 'dsquare'
set -g @tokyo-night-tmux_show_netspeed 1
set -g @tokyo-night-tmux_show_hostname 1

run '~/.tmux/plugins/tpm/tpm'
